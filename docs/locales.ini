dir = ltr
native = Português
page_title = NoteHop — Notas criptografadas ponta a ponta com autodestruição
page_desc = Escreva uma nota, tranque-a no navegador com AES-256-GCM e compartilhe com um link em n.hel.ink. O servidor não lê notas criptografadas, mas lê notas básicas. Parte da família HOP.
og_title = NoteHop — Notas criptografadas ponta a ponta com autodestruição
skip = Ir para o conteúdo
nav_label = Navegação da página
nav_features = Recursos
nav_run = Auto-hospedagem
nav_faq = Perguntas frequentes
