features_h = Что умеет NoteHop
f1_t = Клиентское шифрование AES-256-GCM
f1_d = Браузер шифрует текст перед отправкой. Ключ находится в хеш-фрагменте ссылки (#) и никогда не передается на сервер.
f2_t = Сервер, который не читает зашифрованные заметки
f2_d = Для зашифрованной заметки сервер хранит только шифртекст, поэтому ни операторы, ни дампы базы данных не могут прочитать её заголовок или текст. Обычные заметки хранятся открытым текстом и помечены как обычные.
f3_t = Самоуничтожение и удаление после чтения
f3_d = Заметки могут исчезать сразу после первого прочтения или автоматически удаляться через 10 минут, 1 час, 1 день или 30 дней.
f4_t = Раздельные права для каждой ссылки
f4_d = Создавайте разные ссылки для одной заметки: владелец, только чтение, редактирование, только ответы или чек-листы.
f5_t = Совместное редактирование в реальном времени
f5_d = Пишите вместе в реальном времени через WebSocket-реле. В зашифрованной заметке всё, что передаёт реле, зашифровано.
f6_t = Разнообразие форматов заметок
f6_d = Markdown-заметки, интерактивные списки задач, опросы, формы, фрагменты кода и изолированные веб-страницы.
f7_t = Единый аккаунт для всех сервисов: HOP ID
f7_d = Быстрый вход через систему единого входа HOP ID для всех приложений экосистемы, либо анонимный гостевой режим.
f8_t = Единый бинарный файл на Go для хостинга
f8_d = Один исполняемый файл Go размером около 20 МБ со встроенной SQLite, больше ничего устанавливать не нужно, а установщик запускается одной командой.
run_h = Свой сервер
run_intro = NoteHop можно разместить на собственном сервере за считанные секунды:
run_req_h = Требования
run_req = Go 1.27 или новее, либо Docker. SQLite встроена. Установщик в одну команду, команды Docker и тесты описаны в README на GitHub.
run_sso_h = Настройка авторизации
run_sso = У NoteHop есть собственные аккаунты. Чтобы дополнительно пускать пользователей через хаб HOP ID, задайте в окружении NOTEHOP_BASE_URL, NOTEHOP_SSO_URL и NOTEHOP_SSO_SECRET.
run_db_h = База данных и хранилище
run_db = NoteHop по умолчанию использует встроенную базу SQLite. Резервные копии можно делать на лету командой notehop backup.
run_note = Автономный режим и единая авторизация полностью поддерживаются при самостоятельном развертывании.
faq_h = Частые вопросы
q1 = Может ли сервер или хостинг прочитать мои заметки?
a1 = Зашифрованную заметку — нет. Браузер шифрует её через Web Crypto AES-256-GCM до отправки, а ключ остаётся в хеше URL (#), который браузеры не отправляют серверу. Обычная заметка не зашифрована, и сервер может её прочитать.
q2 = Что делать, если я потеряю ссылку на заметку?
a2 = Зашифрованную заметку не сможет восстановить никто. У NoteHop нет мастер-ключа и чёрного хода, ссылка — единственный вход. Обычную заметку можно найти снова по имени ссылки.
q3 = Могу ли я запустить NoteHop на своем сервере?
a3 = Да. NoteHop компилируется в единственный исполняемый файл без внешних зависимостей. Инструкции приведены в README репозитория.
q4 = Куда сообщать об уязвимостях или ошибках?
a4 = Не создавайте публичный issue об уязвимости. Сообщите о ней приватно через GitHub: откройте вкладку Security репозитория и выберите Report a vulnerability. Подробности в SECURITY.md.
