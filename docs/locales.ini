[de]
dir = ltr
native = Deutsch
page_title = NoteHop — Ende-zu-Ende-verschlüsselte Notizen mit Selbstzerstörung
page_desc = Schreibe eine Notiz, verschließe sie in deinem Browser mit AES-256-GCM und teile sie per Link auf n.hel.ink. Der Server kann verschlüsselte Notizen nicht lesen, einfache Notizen schon. Teil der HOP-Familie.
og_title = NoteHop — Ende-zu-Ende-verschlüsselte Notizen mit Selbstzerstörung
skip = Zum Inhalt springen
nav_label = Seitennavigation
nav_features = Funktionen
nav_run = Selbst betreiben
nav_faq = FAQ
nav_family = HOP-Familie
theme_btn_dark = Dunkles Design
theme_btn_light = Helles Design
kicker = Verschlüsselte Notizen & Dokumente
h1 = Im Browser verschlossen, in Sekunden geteilt
lede = NoteHop verschlüsselt deine Notiz standardmäßig in deinem Browser mit AES-256-GCM, bevor sie dein Gerät verlässt. Der Schlüssel liegt im URL-Fragment (#), sodass der Server eine verschlüsselte Notiz nicht lesen kann. Eine einfache Notiz, die der Server lesen kann, bekommt einen Linknamen deiner Wahl. Kurzlinks auf n.hel.ink, Open Source (MIT).
cta_main = NoteHop ausprobieren
cta_code = Code ansehen
hero_note = Live-Adressen auf dieser Seite verlinken auf die öffentlichen Seiten der HOP-Familie.
features_h = Was NoteHop kann
f1_t = AES-256-GCM im Client
f1_d = Dein Browser verschlüsselt den Inhalt vor dem Speichern. Der Schlüssel reist im Link-Fragment (#) und wird nie an den Server gesendet.
f2_t = Ein Server, der verschlüsselte Notizen nicht lesen kann
f2_d = Bei einer verschlüsselten Notiz speichert der Server nur den Geheimtext, sodass Betreiber und Datenbank-Dumps weder Titel noch Text lesen können. Einfache Notizen werden als Klartext gespeichert und sind als einfach gekennzeichnet.
f3_t = Selbstzerstörung & Löschen nach dem Lesen
f3_d = Notizen können sich direkt nach dem ersten Lesen löschen oder automatisch nach 10 Minuten, 1 Stunde, 1 Tag oder 30 Tagen ablaufen.
f4_t = Fein abgestufte Rechte pro Link
f4_d = Erstelle für dieselbe Notiz verschiedene Links: Inhaber, nur lesen, schreiben, nur antworten oder nur abhaken bei Checklisten.
f5_t = Gemeinsames Bearbeiten live
f5_d = Schreibt gemeinsam in Echtzeit über ein WebSocket-Relay. In einer verschlüsselten Notiz ist alles verschlüsselt, was das Relay weiterreicht.
f6_t = Vielfältige Notizarten
f6_d = Markdown-Text, interaktive Checklisten, Umfragen, Formulare, Code-Notizen mit Syntaxfarben und Web-Notizen in einer abgeschotteten Umgebung.
f7_t = Eine Anmeldung für alle Apps: HOP ID
f7_d = Melde dich nahtlos mit deinem einheitlichen HOP-ID-Konto in der gesamten HOP-Familie an, oder nutze NoteHop anonym als Gast.
f8_t = Selbst hosten mit einem einzigen Go-Programm
f8_d = Ein Go-Programm von etwa 20 MB mit eingebautem SQLite, nichts weiter zu installieren, und ein Installer, der mit einem Befehl auskommt.
run_h = Selbst betreiben
run_intro = NoteHop lässt sich selbst hosten. Baue das einzelne Programm und starte es in Sekunden:
run_req_h = Voraussetzungen
run_req = Go 1.27 oder neuer, oder Docker. SQLite ist eingebaut. Den Ein-Befehl-Installer, die Docker-Befehle und die Testläufe beschreibt die README auf GitHub.
run_sso_h = Anmeldung konfigurieren
run_sso = NoteHop hat eigene Konten. Um Leute zusätzlich über einen HOP-ID-Hub anzumelden, setze NOTEHOP_BASE_URL, NOTEHOP_SSO_URL und NOTEHOP_SSO_SECRET in deiner Umgebung.
run_db_h = Datenbank & Speicher
run_db = NoteHop nutzt standardmäßig eine eingebettete, lokal gespeicherte SQLite-Datenbank. Sicherungen lassen sich im laufenden Betrieb mit notehop backup erstellen.
run_note = Eigenständiger Betrieb und Single Sign-on werden in selbst gehosteten Installationen vollständig unterstützt.
faq_h = FAQ
q1 = Können der Server oder der Hoster meine Notizen lesen?
a1 = Eine verschlüsselte Notiz nicht. Dein Browser verschlüsselt sie vor dem Senden mit Web Crypto AES-256-GCM, und der Schlüssel bleibt im URL-Hash (#), den Browser nicht an einen Server senden. Eine einfache Notiz ist nicht verschlüsselt, der Server kann sie lesen.
q2 = Was passiert, wenn ich den Link zu meiner Notiz verliere?
a2 = Eine verschlüsselte Notiz kann niemand wiederherstellen. NoteHop hat weder einen Generalschlüssel noch eine Hintertür, der Link ist der einzige Zugang. Eine einfache Notiz lässt sich über ihren Linknamen wiederfinden.
q3 = Kann ich NoteHop auf meinem eigenen Server betreiben?
a3 = Ja. NoteHop wird zu einem einzigen eigenständigen Go-Programm ohne externe Abhängigkeiten kompiliert. Die Einrichtung steht in der README des Repositorys.
q4 = Wo melde ich Sicherheitslücken oder Fehler?
a4 = Bitte eröffne für eine Sicherheitslücke kein öffentliches Issue. Melde sie privat über GitHub: Öffne den Reiter Security des Repositorys und wähle Report a vulnerability. Details stehen in SECURITY.md.
family_h = Die HOP-Familie
family_intro = NoteHop gehört zu HOP, einer schlanken Sammlung fokussierter, selbst hostbarer Werkzeuge mit gemeinsamer Anmeldung.
