f1_d = お使いのブラウザが保存前に暗号化。キーはURLフラグメント（#）に含まれ、サーバーへ送信されることはありません。
f2_t = 暗号化ノートを読めないサーバー
f2_d = 暗号化ノートについて、サーバーが保存するのは暗号文だけなので、運営者もデータベースのダンプも、タイトルや本文を読めません。ベーシックノートは平文で保存され、ベーシックと表示されます。
f3_t = 自動消滅と1回限りの閲覧
f3_d = 1回閲覧されたら即座に消去する設定や、10分・1時間・1日・30日後の自動消滅タイマーに対応。
f4_t = リンクごとの柔軟な権限設定
f4_d = オーナー用、閲覧専用、編集可能、返信専用、チェックリスト専用など用途に応じた個別リンクを発行可能。
f5_t = リアルタイム共同編集
f5_d = WebSocket リレーを通じてリアルタイムに共同編集できます。暗号化ノートでは、リレーが中継する内容はすべて暗号化されています。
f6_t = 多彩なノートフォーマット
f6_d = Markdown、インタラクティブチェックリスト、投票、フォーム、シンタックスハイライト付きコード、隔離Webノート。
f7_t = 全アプリ共通サインイン：HOP ID
f7_d = HOP ID シングルサインオンでHOPファミリー全体をシームレスに利用可能。匿名ゲスト利用もサポート。
f8_t = Go単一バイナリでのセルフホスト
f8_d = SQLite 内蔵の約 20 MB の Go 実行ファイル 1 つ。ほかに入れるものはなく、コマンド 1 つのインストーラーもあります。
run_h = セルフホスト
run_intro = NoteHop はご自身で運用可能です。単一バイナリのビルドと起動手順：
run_req_h = 動作要件
run_req = Go 1.27 以降、または Docker。SQLite は内蔵されています。コマンド 1 つのインストーラー、Docker のコマンド、テストについては GitHub の README を参照してください。
run_sso_h = サインイン設定
run_sso = NoteHop には独自のアカウントがあります。HOP ID ハブでもサインインできるようにするには、環境変数に NOTEHOP_BASE_URL、NOTEHOP_SSO_URL、NOTEHOP_SSO_SECRET を設定します。
run_db_h = データベースとストレージ
run_db = 標準で内蔵SQLiteとローカルストレージを使用します。稼働中に notehop backup でバックアップ取得が可能です。
run_note = セルフホスト運用においてスタンドアロンモードとSSOモードの両方を完全サポートしています。
faq_h = よくある質問
q1 = サーバーやホスティング業者は私のノートを読めますか？
a1 = 暗号化ノートは読めません。ブラウザが送信前に Web Crypto の AES-256-GCM で暗号化し、鍵は URL ハッシュ（#）に残ります。ブラウザはこの部分をサーバーに送りません。ベーシックノートは暗号化されておらず、サーバーが読めます。
q2 = ノートのリンクを紛失した場合はどうなりますか？
a2 = 暗号化ノートは誰にも復元できません。NoteHop にはマスターキーもバックドアもなく、リンクが唯一の入口です。ベーシックノートはリンク名から再び見つけられます。
q3 = 自分のサーバーでホストできますか？
a3 = はい。外部ランタイム不要の単一バイナリとしてコンパイルされます。詳細はリポジトリの README をご覧ください。
q4 = 不具合やセキュリティ報告はどこへ連絡すればよいですか？
a4 = 脆弱性について公開の Issue は立てないでください。GitHub から非公開で報告してください。リポジトリの Security タブを開き、Report a vulnerability を選びます。詳しくは SECURITY.md をご覧ください。
