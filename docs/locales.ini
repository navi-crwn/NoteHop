a2 = Dado que NoteHop es de conocimiento cero y no posee claves maestras ni puertas traseras, perder el enlace significa que nadie podrá descifrar la nota.
q3 = ¿Puedo alojar NoteHop en mi servidor?
a3 = Sí. NoteHop se compila en un binario autónomo en Go sin dependencias externas. Consulta las instrucciones en el README del repositorio.
q4 = ¿Dónde informo de errores o problemas de seguridad?
