run_sso_h = Konfigurasi login
run_sso = NoteHop punya akun sendiri. Untuk juga memasukkan orang lewat hub HOP ID, atur NOTEHOP_BASE_URL, NOTEHOP_SSO_URL, dan NOTEHOP_SSO_SECRET di lingkungan Anda.
run_db_h = Basis Data & Penyimpanan
run_db = NoteHop menggunakan basis data SQLite bawaan yang disimpan secara lokal. Pencadangan dapat dilakukan saat berjalan dengan perintah notehop backup.
run_note = Mode mandiri dan SSO didukung penuh dalam instalasi mandiri.
faq_h = Tanya Jawab
q1 = Bisakah server atau pengelola membaca catatan saya?
a1 = Catatan terenkripsi tidak. Browser Anda mengenkripsinya dengan Web Crypto AES-256-GCM sebelum dikirim, dan kuncinya tetap di hash URL (#) yang tidak dikirim browser ke server. Catatan dasar tidak terenkripsi, dan server bisa membacanya.
q2 = Apa yang terjadi jika saya kehilangan tautan catatan saya?
a2 = Catatan terenkripsi tidak bisa dipulihkan siapa pun. NoteHop tidak punya kunci utama maupun pintu belakang, jadi tautan adalah satu-satunya jalan masuk. Catatan dasar bisa ditemukan lagi lewat nama tautannya.
q3 = Bisakah saya meng-host NoteHop di server saya sendiri?
a3 = Bisa. NoteHop dikompilasi menjadi satu biner mandiri Go tanpa ketergantungan runtime eksternal. Lihat petunjuk di README repo.
q4 = Di mana saya dapat melaporkan masalah atau bug?
a4 = Jangan membuka issue publik untuk kerentanan. Laporkan secara privat lewat GitHub: buka tab Security di repositori, lalu pilih Report a vulnerability. Rinciannya ada di SECURITY.md.
