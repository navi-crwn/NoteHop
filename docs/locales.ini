faq_h = FAQ
q1 = Le serveur ou l’hébergeur peut-il lire mes notes ?
a1 = Pas une note chiffrée. Votre navigateur la chiffre avec Web Crypto AES-256-GCM avant l'envoi, et la clé reste dans le hash de l'URL (#), que les navigateurs n'envoient pas à un serveur. Une note basique n'est pas chiffrée, et le serveur peut la lire.
q2 = Que se passe-t-il si je perds le lien de ma note ?
a2 = Une note chiffrée, personne ne peut la récupérer. NoteHop n'a ni clé maîtresse ni porte dérobée : le lien est la seule entrée. Une note basique se retrouve grâce au nom de son lien.
q3 = Puis-je héberger NoteHop sur mon propre serveur ?
a3 = Oui. NoteHop se compile en un unique binaire autonome en Go sans dépendances externes. Consultez le README du dépôt.
q4 = Où signaler un problème ou une faille de sécurité ?
a4 = N'ouvrez pas de ticket public pour une vulnérabilité. Signalez-la en privé via GitHub : ouvrez l'onglet Security du dépôt et choisissez Report a vulnerability. SECURITY.md donne les détails.
