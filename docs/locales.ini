run_note = Tanto el modo independiente como el SSO están totalmente admitidos en autoalojamiento.
faq_h = Preguntas frecuentes
q1 = ¿Puede el servidor o proveedor leer mis notas?
a1 = No. El cifrado ocurre enteramente en tu navegador usando Web Crypto AES-256-GCM. La clave secreta vive en el hash (#) de la URL y nunca llega al servidor.
