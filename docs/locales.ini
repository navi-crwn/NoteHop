run_req = Go 1.27 或更高版本，或 Docker。SQLite 已内置。一条命令的安装脚本、Docker 命令和测试说明见 GitHub 上的 README。
run_sso_h = 登录配置
run_sso = NoteHop 有自己的账户系统。若还要通过 HOP ID 中心登录，请在环境变量中设置 NOTEHOP_BASE_URL、NOTEHOP_SSO_URL 和 NOTEHOP_SSO_SECRET。
run_db_h = 数据库与存储
run_db = NoteHop 默认使用本地存储的内嵌 SQLite 数据库。运行中可随时通过 notehop backup 备份。
run_note = 私有化部署全面支持独立模式与 SSO 统一登录模式。
faq_h = 常见问题
q1 = 服务器或托管商能够读取我的便签内容吗？
a1 = 加密笔记不能。浏览器在发送之前用 Web Crypto AES-256-GCM 加密，密钥留在 URL 哈希（#）里，浏览器不会把它发给服务器。基础笔记没有加密，服务器可以读取。
q2 = 如果我丢失了便签链接会怎样？
a2 = 加密笔记无人能够找回。NoteHop 没有主密钥，也没有后门，链接是唯一的入口。基础笔记可以通过链接名称再找到。
q3 = 我可以部署在自己的服务器上吗？
a3 = 完全可以。NoteHop 编译为单一独立二进制文件，无外部运行时依赖。参见 GitHub 仓库说明。
q4 = 如何报告问题或安全漏洞？
a4 = 请不要为安全漏洞公开提交 issue。请通过 GitHub 私下报告：打开仓库的 Security 标签页，选择 Report a vulnerability。详情见 SECURITY.md。
