[en]
dir = ltr
native = English
page_title = NoteHop — End-to-end encrypted notes with self-destruct
page_desc = Write a note, lock it in your browser with AES-256-GCM, and share links at n.hel.ink. Zero-knowledge, self-destructing, and part of the HOP family.
og_title = NoteHop — End-to-end encrypted notes with self-destruct
skip = Skip to content
nav_label = Page navigation
nav_features = Features
nav_run = Run your own
nav_faq = FAQ
nav_family = HOP family
theme_btn_dark = Dark theme
theme_btn_light = Light theme
kicker = Encrypted notes & docs
h1 = Locked in your browser, shared in seconds
lede = NoteHop encrypts your note client-side with AES-256-GCM before it ever leaves your device. The key lives in the URL fragment (#), so the server cannot read your data. Clean short links at n.hel.ink, open source (MIT).
cta_main = Try NoteHop
cta_code = View the code
hero_note = Live addresses in this page link to the HOP family’s public sites.
features_h = What NoteHop does
f1_t = Client-side AES-256-GCM
f1_d = Your browser encrypts the content before saving. The decryption key travels in the link fragment (#) and is never sent to the server.
f2_t = Zero-knowledge server
f2_d = The server only stores ciphertext blobs. Even operators or database dumps cannot inspect your private text or documents.
f3_t = Self-destruct & burn on read
f3_d = Notes can delete themselves immediately after being read once, or expire automatically after 10 minutes, 1 hour, 1 day, or 30 days.
f4_t = Granular permissions per link
f4_d = Issue different links for the same note: owner, read-only, can-write, reply-only, or tick-only for checklists.
f5_t = Live collaborative editing
f5_d = Work together in real-time over WebSocket relays while retaining end-to-end encryption across all collaborators.
f6_t = Rich note types
f6_d = Markdown text, interactive checklists, polls, forms, syntax-highlighted code notes, and sandboxed web notes.
f7_t = One sign-in for every app: HOP ID
f7_d = Sign in seamlessly with your unified HOP ID account across the entire HOP family, or use NoteHop anonymously as a guest.
f8_t = Single Go binary self-hosting
f8_d = Compiled into a ~16 MB Go executable with embedded SQLite, zero runtime dependencies, and instant deployment.
run_h = Run your own
run_intro = NoteHop is self-hostable. Build and run the single binary in seconds:
run_req_h = Prerequisites
run_req = Go 1.22+ and SQLite. Full quickstart, Docker commands, and test suites are in the README on GitHub.
run_sso_h = Sign-in configuration
run_sso = Sign-in uses HOP ID single sign-on. Set NOTEHOP_SSO_HUB_URL and NOTEHOP_SSO_SECRET in your environment before signing in, or run in standalone mode.
run_db_h = Database & Storage
run_db = NoteHop defaults to an embedded SQLite database stored locally. Backups can be taken while running with notehop backup.
run_note = Standalone and single sign-on modes are fully supported in self-hosted deployments.
faq_h = FAQ
q1 = Can the server or hosting provider read my notes?
a1 = No. Encryption happens entirely within your web browser using Web Crypto AES-256-GCM. The secret key stays in the URL hash (#) and is never transmitted to our servers.
q2 = What happens if I lose the link to my note?
a2 = Because NoteHop is zero-knowledge and has no master keys or backdoors, losing the link means the note cannot be recovered or decrypted by anyone.
q3 = Can I host NoteHop on my own server?
a3 = Yes. NoteHop compiles into a single standalone Go binary with zero external dependencies. See the repository README for setup instructions.
q4 = Where do I report security vulnerabilities or bugs?
a4 = Open an issue on GitHub or email security@hel.ink for responsible vulnerability disclosure.
family_h = The HOP family
family_intro = NoteHop is part of HOP, a lightweight suite of focused, self-hostable tools sharing a unified sign-in.
