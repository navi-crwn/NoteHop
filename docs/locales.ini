run_req = Go 1.22+ 与 SQLite。完整快速上手指引、Docker 命令及测试套件见 GitHub README。
run_sso_h = 登录配置
run_sso = 登录接入 HOP ID 单点登录。启动前在环境中配置 NOTEHOP_SSO_HUB_URL 和 NOTEHOP_SSO_SECRET，亦可独立模式运行。
