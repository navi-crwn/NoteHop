h1 = ブラウザ内で暗号化、瞬時に安全シェア
lede = NoteHop は既定で、ノートが端末を離れる前にブラウザ内で AES-256-GCM により暗号化します。鍵は URL フラグメント（#）にあるため、サーバーは暗号化ノートを読めません。サーバーが読めるベーシックノートには、好きなリンク名を付けられます。n.hel.ink の短いリンク、オープンソース（MIT）。
