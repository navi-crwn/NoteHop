f8_d = Dikompilasi menjadi file eksekusi Go ringan (~16 MB) dengan SQLite bawaan, tanpa ketergantungan runtime eksternal.
run_h = Pasang mandiri
run_intro = NoteHop dapat di-host sendiri. Bangun dan jalankan biner tunggal dalam hitungan detik:
run_req_h = Prasyarat
run_req = Go 1.22+ dan SQLite. Panduan lengkap, instruksi Docker, dan pengujian tersedia di README GitHub.
run_sso_h = Konfigurasi login
run_sso = Login menggunakan SSO HOP ID. Set NOTEHOP_SSO_HUB_URL dan NOTEHOP_SSO_SECRET di lingkungan Anda sebelum masuk, atau jalankan mode mandiri.
run_db_h = Basis Data & Penyimpanan
run_db = NoteHop menggunakan basis data SQLite bawaan yang disimpan secara lokal. Pencadangan dapat dilakukan saat berjalan dengan perintah notehop backup.
run_note = Mode mandiri dan SSO didukung penuh dalam instalasi mandiri.
faq_h = Tanya Jawab
q1 = Bisakah server atau pengelola membaca catatan saya?
a1 = Tidak. Enkripsi berlangsung sepenuhnya di dalam peramban web Anda via Web Crypto AES-256-GCM. Kunci rahasia berada di hash URL (#) dan tidak pernah dikirim ke server.
q2 = Apa yang terjadi jika saya kehilangan tautan catatan saya?
a2 = Karena NoteHop menerapkan zero-knowledge tanpa kunci master atau backdoor, kehilangan tautan berarti catatan tersebut tidak dapat dipulihkan atau didekripsi oleh siapa pun.
q3 = Bisakah saya meng-host NoteHop di server saya sendiri?
a3 = Bisa. NoteHop dikompilasi menjadi satu biner mandiri Go tanpa ketergantungan runtime eksternal. Lihat petunjuk di README repo.
q4 = Di mana saya dapat melaporkan masalah atau bug?
a4 = Buka issue di GitHub atau kirim surel ke security@hel.ink untuk pelaporan kerentanan secara bertanggung jawab.
