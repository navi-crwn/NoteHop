h1 = Bloqueado en tu navegador, compartido en segundos
lede = NoteHop cifra tus notas localmente con AES-256-GCM antes de enviarlas al servidor. La clave permanece en el fragmento de la URL (#), por lo que el servidor no puede leer tus datos. Enlaces limpios en n.hel.ink, código abierto (MIT).
