run_note = 私有化部署全面支持独立模式与 SSO 统一登录模式。
faq_h = 常见问题
q1 = 服务器或托管商能够读取我的便签内容吗？
a1 = 不能。加密完全在浏览器中使用 Web Crypto AES-256-GCM 运算。密钥仅留在 URL 锚点（#），从不发送给服务器。
q2 = 如果我丢失了便签链接会怎样？
a2 = 由于 NoteHop 遵循严格的零知识架构，且不存在主密钥或后门，链接丢失意味着任何人都无法解密或找回该便签。
q3 = 我可以部署在自己的服务器上吗？
a3 = 完全可以。NoteHop 编译为单一独立二进制文件，无外部运行时依赖。参见 GitHub 仓库说明。
q4 = 如何报告问题或安全漏洞？
a4 = 欢迎在 GitHub 提交 Issue，或致信 security@hel.ink 进行负责任的安全漏洞披露。
