f6_t = Beragam format catatan
f6_d = Teks Markdown, daftar periksa interaktif, jajak pendapat, formulir, catatan kode berpewarna sintaks, dan catatan web terisolasi.
f7_t = Satu login untuk semua app: HOP ID
f7_d = Masuk mulus dengan akun single sign-on HOP ID di seluruh keluarga aplikasi HOP, atau gunakan NoteHop tanpa akun sebagai tamu.
