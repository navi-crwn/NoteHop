f1_d = Peramban Anda mengunci teks sebelum disimpan. Kunci enkripsi berada di fragmen link (#) dan tidak pernah dikirim ke server.
f2_t = Server zero-knowledge
f2_d = Server hanya menyimpan gumpalan teks terenkripsi (ciphertext). Operator server atau dump database tetap tidak bisa membaca catatan Anda.
f3_t = Hapus otomatis & bakar setelah dibaca
f3_d = Catatan dapat menghapus diri seketika setelah dibuka sekali, atau kedaluwarsa otomatis setelah 10 menit, 1 jam, 1 hari, atau 30 hari.
