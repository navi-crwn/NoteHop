features_h = NoteHop の機能
f1_t = 端末内 AES-256-GCM 暗号化
f1_d = お使いのブラウザが保存前に暗号化。キーはURLフラグメント（#）に含まれ、サーバーへ送信されることはありません。
f2_t = ゼロ知識（Zero-knowledge）サーバー
f2_d = サーバーには暗号化されたデータのみが保存されます。管理者やデータベースダンプであっても閲覧不可能です。
f3_t = 自動消滅と1回限りの閲覧
f3_d = 1回閲覧されたら即座に消去する設定や、10分・1時間・1日・30日後の自動消滅タイマーに対応。
f4_t = リンクごとの柔軟な権限設定
f4_d = オーナー用、閲覧専用、編集可能、返信専用、チェックリスト専用など用途に応じた個別リンクを発行可能。
f5_t = リアルタイム共同編集
f5_d = WebSocket 中継を介して、参加者間のエンドツーエンド暗号化を維持したままリアルタイムに共同作業。
f6_t = 多彩なノートフォーマット
f6_d = Markdown、インタラクティブチェックリスト、投票、フォーム、シンタックスハイライト付きコード、隔離Webノート。
f7_t = 全アプリ共通サインイン：HOP ID
f7_d = HOP ID シングルサインオンでHOPファミリー全体をシームレスに利用可能。匿名ゲスト利用もサポート。
f8_t = Go単一バイナリでのセルフホスト
f8_d = 約16MBの軽量Goバイナリ1つと内蔵SQLiteで動作。外部ランタイム不要で即時デプロイ可能。
