theme_btn_dark = Tema escuro
theme_btn_light = Tema claro
kicker = Notas e documentos criptografados
h1 = Trancado no seu navegador, compartilhado em segundos
lede = Por padrão, o NoteHop criptografa sua nota no navegador com AES-256-GCM antes de ela sair do seu dispositivo. A chave fica no fragmento da URL (#), então o servidor não consegue ler uma nota criptografada. Uma nota básica, que o servidor pode ler, recebe um nome de link à sua escolha. Links curtos em n.hel.ink, código aberto (MIT).
cta_main = Experimentar NoteHop
cta_code = Ver o código
hero_note = Os endereços ativos nesta página apontam para os sites públicos da família HOP.
features_h = O que o NoteHop faz
f1_t = Criptografia no cliente AES-256-GCM
f1_d = Seu navegador criptografa o texto antes de salvá-lo. A chave de decodificação viaja no fragmento do link (#) e nunca é enviada ao servidor.
f2_t = Um servidor que não lê notas criptografadas
f2_d = Numa nota criptografada, o servidor guarda só o texto cifrado, então operadores e dumps do banco de dados não conseguem ler o título nem o texto. Notas básicas são guardadas em texto simples e aparecem marcadas como básicas.
f3_t = Autodestruição e queima após leitura
f3_d = Notas podem se autoexcluir após a primeira abertura ou expirar automaticamente em 10 minutos, 1 hora, 1 dia ou 30 dias.
f4_t = Permissões granulares por link
f4_d = Emita links diferentes para a mesma nota: proprietário, somente leitura, edição, apenas resposta ou apenas marcação de tarefas.
f5_t = Colaboração ao vivo em tempo real
f5_d = Escreva junto em tempo real por um relay WebSocket. Numa nota criptografada, tudo o que o relay repassa está criptografado.
f6_t = Formatos ricos de nota
f6_d = Textos em Markdown, listas de tarefas, enquetes, formulários, notas de código e páginas web isoladas.
f7_t = Um único login: HOP ID
f7_d = Faça login com a conta unificada HOP ID em toda a família HOP ou utilize o NoteHop anonimamente como visitante.
f8_t = Binário único em Go para auto-hospedagem
f8_d = Um executável Go de cerca de 20 MB com SQLite embutido, sem mais nada para instalar, e um instalador de um comando.
run_h = Auto-hospedagem
run_intro = O NoteHop pode ser hospedado por você. Compile e execute o binário único em segundos:
run_req_h = Requisitos
run_req = Go 1.27 ou mais recente, ou Docker. O SQLite já vem embutido. O instalador de um comando, os comandos do Docker e os testes estão descritos no README no GitHub.
run_sso_h = Configuração de login
run_sso = O NoteHop tem contas próprias. Para também entrar com um hub HOP ID, defina NOTEHOP_BASE_URL, NOTEHOP_SSO_URL e NOTEHOP_SSO_SECRET no seu ambiente.
run_db_h = Banco de Dados e Armazenamento
run_db = O NoteHop utiliza SQLite integrado com armazenamento local. Faça backups durante a execução com notehop backup.
run_note = Os modos independente e SSO são totalmente suportados em instalações próprias.
faq_h = Perguntas frequentes
q1 = O servidor ou provedor consegue ler minhas notas?
a1 = Uma nota criptografada não. Seu navegador a criptografa com Web Crypto AES-256-GCM antes do envio, e a chave fica no hash da URL (#), que os navegadores não enviam a um servidor. Uma nota básica não é criptografada, e o servidor consegue lê-la.
q2 = O que acontece se eu perder o link da minha nota?
a2 = Uma nota criptografada ninguém consegue recuperar. O NoteHop não tem chave mestra nem porta dos fundos, então o link é a única entrada. Uma nota básica pode ser reencontrada pelo nome do link.
q3 = Posso hospedar o NoteHop no meu servidor?
a3 = Sim. O NoteHop compila em um único executável Go sem dependências externas de runtime. Veja o README do repositório.
q4 = Onde posso relatar falhas ou vulnerabilidades?
a4 = Não abra uma issue pública para uma vulnerabilidade. Relate em privado pelo GitHub: abra a aba Security do repositório e escolha Report a vulnerability. Os detalhes estão em SECURITY.md.
