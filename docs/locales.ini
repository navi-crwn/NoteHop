lede = По умолчанию NoteHop шифрует заметку в вашем браузере алгоритмом AES-256-GCM до того, как она покинет устройство. Ключ хранится во фрагменте URL (#), поэтому сервер не может прочитать зашифрованную заметку. Обычная заметка, которую сервер читать может, получает имя ссылки по вашему выбору. Короткие ссылки на n.hel.ink, открытый исходный код (MIT).
