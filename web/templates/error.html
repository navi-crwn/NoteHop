{{define "page"}}error{{end}}
{{define "content"}}
<section class="wrap narrow center gone">
  <div class="gone-art" aria-hidden="true"><img src="/static/img/logo.svg?v={{.Asset}}" alt="" width="96" height="96"></div>
  {{if .Msg}}
  <h1>{{.Title}}</h1>
  <p class="muted">{{.Msg}}</p>
  <a class="btn primary" href="/login">{{.L.T "error.back_login"}}</a>
  {{else}}
  <h1>{{.L.T "error.missing_title"}}</h1>
  <p class="muted">{{.L.T "error.missing_text"}}</p>
  <a class="btn primary" href="/new"><svg><use href="#i-plus"/></svg>{{.L.T "error.write_new"}}</a>
  {{end}}
</section>
{{end}}
