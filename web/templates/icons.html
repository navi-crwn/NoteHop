{{define "editor"}}
<div class="editor" data-editor data-view="write">
  <div class="ed-bar">
    <div class="ed-left">
    <!-- note type: Plain, Document (Markdown) or Code; editor.js switches the tools -->
    <div class="menu ed-type">
      <button type="button" class="btn sm ed-type-btn" aria-haspopup="menu" title="{{.L.T "type.label"}}"><svg class="ed-type-ico"><use href="#i-doc"/></svg><span class="ed-type-name">{{.L.T "type.doc"}}</span><svg class="dd"><use href="#i-down"/></svg></button>
      <div class="menu-list ed-type-list" role="menu" aria-label="{{.L.T "type.label"}}">
        <button type="button" role="menuitemradio" data-type="plain" aria-checked="false"><svg><use href="#i-plain"/></svg><span><b>{{.L.T "type.plain"}}</b><small>{{.L.T "type.plain_d"}}</small></span></button>
        <button type="button" role="menuitemradio" data-type="doc" aria-checked="true"><svg><use href="#i-doc"/></svg><span><b>{{.L.T "type.doc"}}</b><small>{{.L.T "type.doc_d"}}</small></span></button>
        <button type="button" role="menuitemradio" data-type="code" aria-checked="false"><svg><use href="#i-code"/></svg><span><b>{{.L.T "type.code"}}</b><small>{{.L.T "type.code_d"}}</small></span></button>
        <button type="button" role="menuitemradio" data-type="web" aria-checked="false"><svg><use href="#i-play"/></svg><span><b>{{.L.T "type.web"}}</b><small>{{.L.T "type.web_d"}}</small></span></button>
        <p class="ed-type-foot">{{.L.T "type.foot"}}</p>
      </div>
    </div>
    <div class="seg" role="tablist" aria-label="{{.L.T "ed.view"}}">
      <button type="button" role="tab" data-view="write" aria-selected="true">{{.L.T "ed.write"}}</button>
      <button type="button" role="tab" data-view="preview" aria-selected="false">{{.L.T "ed.preview"}}</button>
      <button type="button" role="tab" data-view="split" aria-selected="false" class="wide-only">{{.L.T "ed.split"}}</button>
    </div>
    </div>
    <div class="ed-tools" aria-label="{{.L.T "ed.insert"}}">
      <button type="button" class="icon-btn sm" data-cmd="bold" title="{{.L.T "ed.bold"}}"><svg><use href="#i-bold"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="h2" title="{{.L.T "ed.heading"}}"><svg><use href="#i-heading"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="todo" title="{{.L.T "ed.todo"}}"><svg><use href="#i-check"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="code" title="{{.L.T "ed.code"}}"><svg><use href="#i-code"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="table" title="{{.L.T "ed.table"}}"><svg><use href="#i-table"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="spoiler" title="{{.L.T "ed.spoiler"}}"><svg><use href="#i-spoiler"/></svg></button>
      <button type="button" class="icon-btn sm" data-cmd="locked" title="{{.L.T "ed.locked"}}"><svg><use href="#i-lock"/></svg></button>
    </div>
    <select class="ed-lang" aria-label="{{.L.T "type.lang"}}"><option value="">{{.L.T "type.lang_auto"}}</option></select>
    {{if ne .AI "off"}}<button type="button" class="btn sm ed-ai" data-ai="{{.AI}}"{{if .AICustom}} data-custom="1"{{end}} title="{{.L.T "ai.title"}}"><svg><use href="#i-spark"/></svg><span>AI</span></button>{{end}}
  </div>
  <div class="ed-body">
    <pre class="ed-gutter" aria-hidden="true"></pre>
    <textarea class="ed-src" dir="auto" aria-label="{{.L.T "ed.body"}}" spellcheck="true" placeholder="{{.L.T "ed.placeholder"}}"></textarea>
    <div class="ed-preview md" dir="auto" aria-live="polite"></div>
  </div>
  <div class="ed-foot"><span class="ed-foot-doc">{{.L.H "ed.foot"}}</span><span class="ed-foot-code"><svg><use href="#i-shield"/></svg>{{.L.T "type.code_safe"}}</span><span class="ed-foot-web"><svg><use href="#i-shield"/></svg>{{.L.T "web.safe"}}</span><span class="ed-count"></span></div>
</div>
{{end}}
