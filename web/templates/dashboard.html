{{define "page"}}dashboard{{end}}
{{define "content"}}
<section class="wrap">
  <div class="page-head">
    <div><h1>{{.L.T "title.dashboard"}}</h1><p class="muted">{{.L.T "dash.lead"}}</p></div>
    <a class="btn primary" href="/"><svg><use href="#i-plus"/></svg>{{.L.T "nav.new"}}</a>
  </div>
  <div class="alert info hide" id="vault-locked">{{if .User.SSOID}}{{.L.H "dash.locked_sso"}}{{else}}{{.L.H "dash.locked_password"}}{{end}}</div>
  <input type="search" id="filter" class="filter" placeholder="{{.L.T "dash.search"}}" aria-label="{{.L.T "dash.search"}}">
  <ul class="note-list" id="mine"><li class="muted">{{.L.T "common.loading"}}</li></ul>
</section>
{{end}}
{{define "scripts"}}
<script src="/static/js/crypto.js?v={{.Asset}}"></script>
<script src="/static/js/dashboard.js?v={{.Asset}}"></script>
{{end}}
