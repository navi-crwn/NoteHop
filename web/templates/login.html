{{define "page"}}login{{end}}
{{define "content"}}
<section class="wrap auth-wrap">
  <form class="card auth" id="auth-form" data-kind="login">
    <h1>Masuk</h1>
    <p class="muted">Password-mu tidak pernah dikirim ke server. Browser menurunkan kunci dari password itu untuk membuka catatanmu.</p>
    <div class="field"><label for="username">Username</label><input type="text" id="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
    <div class="alert err hide" id="auth-err" role="alert"></div>
    <button class="btn primary lg block" type="submit"><span>Masuk</span></button>
    {{if .Reg}}<p class="small muted center">Belum punya akun? <a href="/register">Daftar</a></p>{{end}}
  </form>
</section>
{{end}}
{{define "scripts"}}
<script src="/static/js/crypto.js?v={{.Asset}}"></script>
<script src="/static/js/auth.js?v={{.Asset}}"></script>
{{end}}
