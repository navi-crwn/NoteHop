name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go build -o "$RUNNER_TEMP/notehop" ./cmd/notehop
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      # Browser checks for web notes against a fresh server on an empty database.
      - name: node scripts/e2e-web.js
        run: |
          "$RUNNER_TEMP/notehop" -addr 127.0.0.1:8090 -db "$RUNNER_TEMP/e2e.db" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/ -o /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/ -o /dev/null || { echo "server did not start" >&2; exit 1; }
          NOTEHOP_URL=http://127.0.0.1:8090 node scripts/e2e-web.js
